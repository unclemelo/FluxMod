<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoMod — Dashboard</title>
    <link rel="stylesheet" href="./Styles/styles.css" />
  </head>
  <body>
    <header>
      <div class="header-content">
        <h1>AutoMod — Dashboard</h1>
        <div id="auth-area"></div>
      </div>
    </header>

    <main class="container">
      <section id="status">
        <p class="muted">Checking authentication...</p>
      </section>

      <section id="dashboard" style="display: none">
        <h2>Guilds</h2>
        <div id="guilds"></div>

        <h3>Create Rule</h3>
        <form id="create-rule-form">
          <label
            >Guild
            <select id="guild-select"></select>
          </label>

          <label>Rule name <input id="rule-name" required /></label>
          <label>Pattern <input id="rule-pattern" required /></label>
          <label>Action <input id="rule-action" required /></label>
          <label
            >Threshold
            <input id="rule-threshold" type="number" value="1" min="1" />
          </label>
          <label>
            <input id="rule-enabled" type="checkbox" checked /> Enabled
          </label>

          <button type="submit">Create</button>
        </form>

        <h3>Raw API</h3>
        <pre id="raw"></pre>
      </section>
    </main>

    <script type="module" src="./JS/main.js"></script>
  </body>
</html>
