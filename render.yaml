services:
  - type: web
    name: automod-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt ; pip install -r bot/requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker api:app --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: OAUTH_PROVIDER
        value: fluxer
      - key: FLUXER_AUTHORIZE_URL
        value: https://api.fluxer.app/v1/oauth2/authorize
      - key: FLUXER_TOKEN_URL
        value: https://api.fluxer.app/v1/oauth2/token
      - key: FLUXER_API_BASE_URL
        value: https://api.fluxer.app/v1
      - key: FLUXER_USER_ENDPOINT
        value: https://api.fluxer.app/v1/oauth2/userinfo
      - key: ENVIRONMENT
        value: production
      - key: SESSION_SAME_SITE
        value: none
      - key: SESSION_HTTPS_ONLY
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: RUN_BOT_WITH_BACKEND
        value: "true"
      - key: FLUXER_TOKEN
        sync: false
      - key: FLUXER_CLIENT_ID
        sync: false
      - key: FLUXER_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false